# Language Redirects
# Always send / to /dk (DK is default)
[[redirects]]
  from = "/"
  to = "/dk"
  status = 302

# Let deep links under /dk and /en resolve to their MPA entry files
[[redirects]]
  from = "/dk/*"
  to = "/dk/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/en/index.html"
  status = 200

# Performance & Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Ensure browsers don't "guess" the MIME type
    X-Content-Type-Options = "nosniff"
    # Referral policy for privacy/SEO tracking
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force HTTPS (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy - FIXED FOR SVG FLAGS AND FONTS!
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; frame-src 'self' https://www.google.com https://www.google.com/maps/embed/ https://maps.google.com;"

# Cache static assets (CSS/JS/Images) for better LCP
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
